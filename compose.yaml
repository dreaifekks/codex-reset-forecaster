name: codex-reset-forecaster

services:
  reset-forecaster:
    build: .
    restart: unless-stopped
    user: "${RESET_UID:-1000}:${RESET_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${RESET_HOST_PORT:-8799}:8787"
    environment:
      X_BEARER_TOKEN_FILE: "${X_BEARER_TOKEN_FILE:-}"
      X_SEARCH_GATEWAY_ENABLED: "${X_SEARCH_GATEWAY_ENABLED:-false}"
      X_SEARCH_GATEWAY_URL: "${X_SEARCH_GATEWAY_URL:-http://host.docker.internal:8787}"
      X_SEARCH_GATEWAY_PROVIDER: "${X_SEARCH_GATEWAY_PROVIDER:-grokbuild}"
      X_SEARCH_GATEWAY_TOKEN_FILE: "${X_SEARCH_GATEWAY_TOKEN_FILE:-/run/secrets/x-search-gateway-token}"
      RESET_SEMANTIC_ASSISTANCE_ENABLED: "${RESET_SEMANTIC_ASSISTANCE_ENABLED:-false}"
      RESET_SEMANTIC_ASSISTANCE_BASE_URL: "${RESET_SEMANTIC_ASSISTANCE_BASE_URL:-https://tokenflux.dev/v1}"
      RESET_SEMANTIC_ASSISTANCE_MODEL: "${RESET_SEMANTIC_ASSISTANCE_MODEL:-deepseek-v4-flash}"
      RESET_SEMANTIC_ASSISTANCE_TOKEN_FILE: "${RESET_SEMANTIC_ASSISTANCE_TOKEN_FILE:-}"
      RSSHUB_BASE_URL: "${RSSHUB_BASE_URL:-https://rss.dreaife.tokyo}"
      HISTORICAL_MONITOR_ENABLED: "${HISTORICAL_MONITOR_ENABLED:-false}"
      HISTORICAL_MONITOR_URL: "${HISTORICAL_MONITOR_URL:-https://codex-resets.com/}"
      RESET_CONFIG: "${RESET_CONFIG:-/app/config/default.json}"
      RESET_SCHEDULER_ENABLED: "${RESET_SCHEDULER_ENABLED:-true}"
      RESET_RUN_ON_START: "${RESET_RUN_ON_START:-true}"
      RESET_PUBLIC_BASE_URL: "${RESET_PUBLIC_BASE_URL:-https://codexreset.dreaife.tokyo}"
      RESET_PUBLICATION_ENABLED: "${RESET_PUBLICATION_ENABLED:-false}"
      WEB_PUSH_ENABLED: "${WEB_PUSH_ENABLED:-false}"
      WEB_PUSH_VAPID_KEYS_FILE: "${WEB_PUSH_VAPID_KEYS_FILE:-/run/secrets/web-push-vapid.json}"
      WEB_PUSH_VAPID_SUBJECT: "${WEB_PUSH_VAPID_SUBJECT:-}"
      TRAFFIC_MONITOR_ENABLED: "${TRAFFIC_MONITOR_ENABLED:-true}"
      FORECASTER_OPERATIONS_TOKEN_FILE: "${FORECASTER_OPERATIONS_TOKEN_FILE:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - reset-forecaster-data:/data
      - ./config:/app/config:ro
      - "${X_BEARER_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/x-bearer-token:ro"
      - "${X_SEARCH_GATEWAY_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/x-search-gateway-token:ro"
      - "${RESET_SEMANTIC_ASSISTANCE_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/semantic-assistance-token:ro"
      - "${WEB_PUSH_VAPID_KEYS_FILE_HOST:-/dev/null}:/run/secrets/web-push-vapid.json:ro"
      - "${FORECASTER_OPERATIONS_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/forecaster-operations-token:ro"
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  reset-forecaster-bot:
    profiles: ["telegram"]
    build: .
    restart: unless-stopped
    user: "${RESET_UID:-1000}:${RESET_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    command: ["node", "src/telegram-bot.mjs"]
    environment:
      TELEGRAM_BOT_TOKEN_FILE: "/run/secrets/telegram-bot-token"
      TELEGRAM_BOT_LOCALE: "zh-CN"
      TELEGRAM_BOT_API_BASE: "${TELEGRAM_BOT_API_BASE:-https://api.telegram.org}"
      FORECASTER_API_BASE: "http://reset-forecaster:8787"
      FORECASTER_PUBLIC_BASE_URL: "${RESET_PUBLIC_BASE_URL:-https://codexreset.dreaife.tokyo}"
      TELEGRAM_ADMIN_USER_IDS: "${TELEGRAM_ADMIN_USER_IDS:-}"
      TELEGRAM_BLOCKED_USER_IDS: "${TELEGRAM_BLOCKED_USER_IDS:-}"
      TELEGRAM_ALLOWED_GROUP_CHAT_IDS: "${TELEGRAM_ALLOWED_GROUP_CHAT_IDS:-}"
      TELEGRAM_NOTIFICATION_CHAT_IDS: "${TELEGRAM_NOTIFICATION_CHAT_IDS:-}"
      TELEGRAM_EXPERIMENTAL_CHAT_IDS: "${TELEGRAM_EXPERIMENTAL_CHAT_IDS:-}"
      TELEGRAM_COMMAND_RATE_LIMIT: "${TELEGRAM_COMMAND_RATE_LIMIT:-12}"
      TELEGRAM_COMMAND_RATE_WINDOW_SECONDS: "${TELEGRAM_COMMAND_RATE_WINDOW_SECONDS:-60}"
      TELEGRAM_FORECAST_INPUT_POLL_INTERVAL_MS: "${TELEGRAM_FORECAST_INPUT_POLL_INTERVAL_MS:-30000}"
      FORECASTER_OPERATIONS_TOKEN_FILE: "${FORECASTER_OPERATIONS_TOKEN_FILE:-}"
      TELEGRAM_OPERATIONS_ALERTS_ENABLED: "${TELEGRAM_OPERATIONS_ALERTS_ENABLED:-false}"
      TELEGRAM_OPERATIONS_ALERT_POLL_INTERVAL_MS: "${TELEGRAM_OPERATIONS_ALERT_POLL_INTERVAL_MS:-60000}"
      TELEGRAM_DISPLAY_TIME_ZONE: "${TELEGRAM_DISPLAY_TIME_ZONE:-Asia/Tokyo}"
      TELEGRAM_BOT_DATA_DIR: "/bot-data"
    depends_on:
      reset-forecaster:
        condition: service_healthy
    volumes:
      - reset-forecaster-bot-data:/bot-data
      - "${TELEGRAM_BOT_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/telegram-bot-token:ro"
      - "${FORECASTER_OPERATIONS_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/forecaster-operations-token:ro"
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
      test: ["CMD", "node", "src/telegram-healthcheck.mjs"]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  reset-forecaster-bot-en:
    profiles: ["telegram-en"]
    build: .
    restart: unless-stopped
    user: "${RESET_UID:-1000}:${RESET_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    command: ["node", "src/telegram-bot.mjs"]
    environment:
      TELEGRAM_BOT_TOKEN_FILE: "/run/secrets/telegram-bot-token"
      TELEGRAM_BOT_LOCALE: "en"
      TELEGRAM_BOT_API_BASE: "${TELEGRAM_BOT_API_BASE:-https://api.telegram.org}"
      FORECASTER_API_BASE: "http://reset-forecaster:8787"
      FORECASTER_PUBLIC_BASE_URL: "${TELEGRAM_EN_PUBLIC_BASE_URL:-https://codexreset.dreaife.tokyo/en}"
      TELEGRAM_ADMIN_USER_IDS: "${TELEGRAM_EN_ADMIN_USER_IDS:-}"
      TELEGRAM_BLOCKED_USER_IDS: "${TELEGRAM_EN_BLOCKED_USER_IDS:-}"
      TELEGRAM_ALLOWED_GROUP_CHAT_IDS: "${TELEGRAM_EN_ALLOWED_GROUP_CHAT_IDS:-}"
      TELEGRAM_NOTIFICATION_CHAT_IDS: "${TELEGRAM_EN_NOTIFICATION_CHAT_IDS:-}"
      TELEGRAM_EXPERIMENTAL_CHAT_IDS: "${TELEGRAM_EN_EXPERIMENTAL_CHAT_IDS:-}"
      TELEGRAM_COMMAND_RATE_LIMIT: "${TELEGRAM_EN_COMMAND_RATE_LIMIT:-12}"
      TELEGRAM_COMMAND_RATE_WINDOW_SECONDS: "${TELEGRAM_EN_COMMAND_RATE_WINDOW_SECONDS:-60}"
      TELEGRAM_FORECAST_INPUT_POLL_INTERVAL_MS: "${TELEGRAM_EN_FORECAST_INPUT_POLL_INTERVAL_MS:-30000}"
      FORECASTER_OPERATIONS_TOKEN_FILE: "${FORECASTER_OPERATIONS_TOKEN_FILE:-}"
      TELEGRAM_OPERATIONS_ALERTS_ENABLED: "${TELEGRAM_EN_OPERATIONS_ALERTS_ENABLED:-false}"
      TELEGRAM_OPERATIONS_ALERT_POLL_INTERVAL_MS: "${TELEGRAM_EN_OPERATIONS_ALERT_POLL_INTERVAL_MS:-60000}"
      TELEGRAM_DISPLAY_TIME_ZONE: "${TELEGRAM_EN_DISPLAY_TIME_ZONE:-Asia/Tokyo}"
      TELEGRAM_BOT_DATA_DIR: "/bot-data"
    depends_on:
      reset-forecaster:
        condition: service_healthy
    volumes:
      - reset-forecaster-bot-en-data:/bot-data
      - "${TELEGRAM_EN_BOT_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/telegram-bot-token:ro"
      - "${FORECASTER_OPERATIONS_TOKEN_FILE_HOST:-/dev/null}:/run/secrets/forecaster-operations-token:ro"
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
      test: ["CMD", "node", "src/telegram-healthcheck.mjs"]
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  reset-forecaster-data:
    external: true
    name: "${RESET_DATA_VOLUME:-codex-reset-forecaster-data-v1}"
  reset-forecaster-bot-data:
    name: "${TELEGRAM_BOT_DATA_VOLUME:-codex-reset-forecaster-bot-data-v1}"
  reset-forecaster-bot-en-data:
    name: "${TELEGRAM_EN_BOT_DATA_VOLUME:-codex-reset-forecaster-bot-en-data-v1}"
